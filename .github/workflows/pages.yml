# Build the example (signals explainer + memory inspector) and publish it
# to GitHub Pages on every push to the working branch.
name: pages

on:
  push:
    branches: [dalien-signals]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm
      - name: Build dalien-signals
        run: |
          pnpm install --ignore-workspace
          node build.js
      - name: Build the example site
        working-directory: example
        run: |
          pnpm install --ignore-workspace
          npx vite build --base=/dalien-signals/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
