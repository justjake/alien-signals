# Build the example (signals explainer + memory inspector) and publish it
# to GitHub Pages on every push to the working branch.
name: pages

on:
  push:
    branches: [dalien-signals]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Same pinned harness as benchmark.yml: the example's benchmark worker
  # imports the fork's suites and adapters from source.
  # Pinned fork of the milomg harness (suites, adapters, lockfile all
  # committed there); bump FORK_SHA deliberately when the fork moves.
  FORK_REPO: https://github.com/justjake/js-reactivity-benchmark
  FORK_SHA: 49dae07763f4277966462fef9e482ba3c1980d66
  # The fork's core links ../upstream-alien-signals (the comparator build).
  ALIEN_REPO: https://github.com/stackblitz/alien-signals
  ALIEN_SHA: c00e63969bf261fc5dce31fae70cb9a90912b06e

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: packages/dalien-signals
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm
      - name: Stub cosignal packages (private to the parent repo)
        run: |
          mkdir -p packages/cosignal/src
          cat > packages/cosignal/package.json <<'EOF'
          {
            "name": "cosignal",
            "version": "0.0.0-stub",
            "type": "module",
            "exports": { ".": "./src/stub.ts", "./logged": "./src/stub.ts" }
          }
          EOF
          cat > packages/cosignal/src/stub.ts <<'EOF'
          const die = (): never => {
            throw new Error("cosignal is private to the parent repo and not available on the public site");
          };
          export class Atom { constructor(_v?: unknown) { die(); } get state(): never { return die(); } set(_v: unknown): never { return die(); } }
          export class Computed { constructor(_fn?: unknown) { die(); } get state(): never { return die(); } }
          export const effect = die;
          export const effectScope = die;
          export const startBatch = die;
          export const endBatch = die;
          export const untracked = die;
          export const registerReactBridge = (): void => {};
          EOF
      - name: Clone pinned harness fork (suites + adapters for the example)
        run: |
          git clone --no-checkout "$FORK_REPO" milomg-reactivity-benchmark
          git -C milomg-reactivity-benchmark checkout "$FORK_SHA"
          git clone --no-checkout "$ALIEN_REPO" upstream-alien-signals
          git -C upstream-alien-signals checkout "$ALIEN_SHA"
          (cd upstream-alien-signals && npm install && npm run build)
          # The example imports the fork's adapter SOURCES, which resolve
          # dependencies from the fork's own node_modules.
          pnpm install --dir milomg-reactivity-benchmark --no-frozen-lockfile
      - name: Build dalien-signals
        working-directory: packages/dalien-signals
        run: |
          pnpm install --ignore-workspace
          node build.js
      - name: Build the example site
        working-directory: packages/dalien-signals/example
        run: |
          pnpm install --ignore-workspace
          npx vite build --base=/dalien-signals/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/dalien-signals/example/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
