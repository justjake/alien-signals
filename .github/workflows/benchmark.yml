# Benchmark dalien-signals against upstream alien-signals (and the rest of
# the contested cluster) on every push to main, under both Node and Bun.
# Each runtime job uploads a CSV of per-test medians and a rendered PNG chart.
#
# Design notes:
# - The harness is the milomg js-reactivity-benchmark plus this repo's fork
#   changes (median-of-N estimator, interleaved isolated runner, adapters),
#   stored as benchs/ci/milomg-fork.patch and applied to a pinned upstream
#   clone. Regenerate with benchs/ci/regen-patch.sh when the fork changes.
# - Frameworks and suites are NEVER sharded across runners: comparing
#   framework A on one machine with framework B on another is invalid.
#   ROUNDS are sharded instead: each round job runs a complete interleaved
#   pass (A B C ...) on its own runner — a self-contained same-machine
#   comparison — and the aggregate job takes per-test medians across the
#   three rounds (benchs/ci/merge-rounds.mjs explains why that keeps
#   ratios honest). Three shards x two runtimes = 6 parallel jobs; a full
#   frameworks=ALL dispatch completes in about the time of one round.
# - Hosted runners are noisy neighbors. Treat run-over-run deltas under ~5%
#   as weather, not signal; the interesting artifact is dalien vs alien
#   within one run.

name: benchmark

on:
  push:
    # master is upstream's default branch in this fork; dalien-signals is
    # the fork's working branch.
    branches: [master, main, dalien-signals]
  workflow_dispatch:
    inputs:
      frameworks:
        description: 'Framework names (quoted, space-separated), or ALL'
        required: false
        default: '"Dalien Signals" "Alien Signals" "Reactively" "Preact Signals"'
      shards:
        description: 'Round shards as a JSON array; more shards = tighter medians at the same wall-clock (each is a full same-machine pass)'
        required: false
        default: '[1, 2, 3]'
      runner:
        description: 'Runner label for round jobs (e.g. a larger or self-hosted runner; all shards must use the same label so blocks stay comparable)'
        required: false
        default: 'ubuntu-latest'

concurrency:
  # Keyed by trigger so a workflow-tweak push cannot cancel a long
  # frameworks=ALL dispatch mid-measurement (learned the hard way, twice).
  group: benchmark-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned harness + upstream comparator; bump deliberately, together with
  # regenerating milomg-fork.patch if the harness pin moves.
  MILOMG_REPO: https://github.com/milomg/js-reactivity-benchmark
  MILOMG_SHA: 56eb45e84b3f6fcfa867840725e66b59a9b7467a
  ALIEN_REPO: https://github.com/stackblitz/alien-signals
  ALIEN_SHA: c00e63969bf261fc5dce31fae70cb9a90912b06e
  FRAMEWORKS: ${{ inputs.frameworks || '"Dalien Signals" "Alien Signals" "Reactively" "Preact Signals"' }}

jobs:
  round:
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
        round: ${{ fromJSON(inputs.shards || '[1, 2, 3]') }}
    name: round-${{ matrix.runtime }}-${{ matrix.round }}
    # Precedence: explicit dispatch input > the BENCH_RUNNER repo variable
    # (Settings -> Secrets and variables -> Actions -> Variables) > free
    # hosted runners. Set BENCH_RUNNER once after installing a runner
    # provider and every run, including push-triggered ones, uses it.
    runs-on: ${{ inputs.runner || vars.BENCH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 150
    steps:
      # Recreate the local development layout so the harness's relative
      # file: dependencies resolve unchanged:
      #   $WS/packages/dalien-signals      (this repo)
      #   $WS/milomg-reactivity-benchmark  (pinned clone + fork patch)
      #   $WS/upstream-alien-signals       (pinned clone, built)
      - uses: actions/checkout@v4
        with:
          path: packages/dalien-signals

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'

      - run: npm install -g pnpm

      - name: Clone pinned harness and comparator
        run: |
          git clone --no-checkout "$MILOMG_REPO" milomg-reactivity-benchmark
          git -C milomg-reactivity-benchmark checkout "$MILOMG_SHA"
          git -C milomg-reactivity-benchmark apply "$GITHUB_WORKSPACE/packages/dalien-signals/benchs/ci/milomg-fork.patch"
          git clone --no-checkout "$ALIEN_REPO" upstream-alien-signals
          git -C upstream-alien-signals checkout "$ALIEN_SHA"

      # The shared harness patch also carries adapters for the cosignal
      # family, which lives in a private sibling repo this workflow cannot
      # fetch. Satisfy the module graph with a stub exporting the adapter's
      # import surface as throwing members; cosignal is never in this
      # workflow's FRAMEWORKS, so the stubs can only be reached by mistake —
      # and then they fail loudly. The parent repo's benchmark workflow is
      # where cosignal is actually measured.
      - name: Stub cosignal packages (private to the parent repo)
        run: |
          mkdir -p packages/cosignal/src
          cat > packages/cosignal/package.json <<'EOF'
          {
            "name": "cosignal",
            "version": "0.0.0-stub",
            "type": "module",
            "exports": { ".": "./src/stub.ts", "./logged": "./src/stub.ts" }
          }
          EOF
          cat > packages/cosignal/src/stub.ts <<'EOF'
          const die = (): never => {
            throw new Error("cosignal stub: this workflow cannot benchmark cosignal (private repo); use the parent repo's benchmark workflow");
          };
          export class Atom { constructor(_v?: unknown) { die(); } get state(): never { return die(); } set(_v: unknown): never { return die(); } }
          export class Computed { constructor(_fn?: unknown) { die(); } get state(): never { return die(); } }
          export const effect = die;
          export const effectScope = die;
          export const startBatch = die;
          export const endBatch = die;
          export const untracked = die;
          export const registerReactBridge = (): void => {};
          EOF

      - name: Build upstream alien-signals (esm/ is a local build artifact)
        working-directory: upstream-alien-signals
        run: |
          npm install
          npm run build

      - name: Build dalien-signals
        working-directory: packages/dalien-signals
        run: |
          pnpm install --ignore-workspace
          node build.js
          npx vitest run

      - name: Build benchmark runner
        working-directory: milomg-reactivity-benchmark
        run: |
          pnpm install --no-frozen-lockfile
          cd packages/node
          npx esbuild src/index.ts src/isolated.ts --bundle --format=esm --platform=node --target=esnext --outdir=dist --sourcemap=external

      - name: Run benchmark round (${{ matrix.runtime }} r${{ matrix.round }})
        working-directory: milomg-reactivity-benchmark/packages/node
        run: |
          if [ "$FRAMEWORKS" = "ALL" ]; then ARGS=""; else ARGS="$FRAMEWORKS"; fi
          RUNNER=node
          if [ "${{ matrix.runtime }}" = "bun" ]; then RUNNER=bun; fi
          echo "$ARGS" | xargs "$RUNNER" dist/isolated.js --rounds 1 > "$GITHUB_WORKSPACE/results-${{ matrix.runtime }}-r${{ matrix.round }}.csv"
          cat "$GITHUB_WORKSPACE/results-${{ matrix.runtime }}-r${{ matrix.round }}.csv"

      - uses: actions/upload-artifact@v4
        with:
          name: rounds-${{ matrix.runtime }}-${{ matrix.round }}
          path: results-${{ matrix.runtime }}-r${{ matrix.round }}.csv
          if-no-files-found: error

  aggregate:
    needs: round
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    name: bench-${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: packages/dalien-signals

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'

      - uses: actions/download-artifact@v4
        with:
          pattern: rounds-${{ matrix.runtime }}-*
          merge-multiple: true

      - name: Merge rounds (per-test median across same-machine blocks)
        run: |
          node packages/dalien-signals/benchs/ci/merge-rounds.mjs \
            "results-${{ matrix.runtime }}.csv" \
            results-${{ matrix.runtime }}-r*.csv

      # The runner tolerates crashed children (medians over surviving
      # rounds), which is right for flaky third parties but must not let a
      # framework vanish from the chart silently — a missing framework means
      # its child crashed every round (e.g. library/adapter version skew).
      - name: Verify every requested framework produced results
        run: |
          if [ "$FRAMEWORKS" = "ALL" ]; then exit 0; fi
          missing=0
          eval "set -- $FRAMEWORKS"
          for fw in "$@"; do
            if ! grep -q "^$fw *," "results-${{ matrix.runtime }}.csv"; then
              echo "::error::$fw produced no benchmark rows (its child crashed in every round)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Render chart PNG
        run: |
          RUNTIME_VERSION=$(node --version)
          if [ "${{ matrix.runtime }}" = "bun" ]; then RUNTIME_VERSION="bun $(bun --version)"; else RUNTIME_VERSION="Node $RUNTIME_VERSION"; fi
          node packages/dalien-signals/benchs/chart.mjs \
            "results-${{ matrix.runtime }}.csv" \
            "benchmark-${{ matrix.runtime }}.svg" \
            "Total benchmark time by framework" \
            "js-reactivity-benchmark (median of interleaved isolated rounds (one runner per round)), $RUNTIME_VERSION, GitHub Actions $(uname -m) - lower is better"
          HEIGHT=$(grep -o 'height="[0-9]*"' "benchmark-${{ matrix.runtime }}.svg" | head -1 | grep -o '[0-9]*')
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --screenshot="benchmark-${{ matrix.runtime }}.png" \
            --window-size=1080,"$HEIGHT" --force-device-scale-factor=2 \
            --default-background-color=FFFFFFFF \
            "file://$GITHUB_WORKSPACE/benchmark-${{ matrix.runtime }}.svg"

      - name: Job summary
        run: |
          {
            echo "### Benchmark totals (${{ matrix.runtime }}, median across round shards)"
            echo ""
            echo '| framework | total (ms) |'
            echo '| --- | ---: |'
            awk -F',' 'NR>1 && $3+0>0 {gsub(/^ +| +$/,"",$1); t[$1]+=$3} END {for (f in t) printf "| %s | %d |\n", f, t[f]}' \
              "results-${{ matrix.runtime }}.csv" | sort -t'|' -k3 -n
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.runtime }}
          path: |
            results-${{ matrix.runtime }}.csv
            benchmark-${{ matrix.runtime }}.svg
            benchmark-${{ matrix.runtime }}.png
          if-no-files-found: error
